name: C/C++ CI

on:
  push:
    branches: [ "main" ]

jobs:
  lint:
    name: Lint (Cppcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Cppcheck
        run: sudo apt-get update && sudo apt-get install -y cppcheck
      - name: Run Cppcheck
        run: cppcheck --enable=all --std=c11 --suppress=missingIncludeSystem --suppress=unusedFunction --error-exitcode=1 src/

  test:
    name: Test (CMake & CTest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake lcov
      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DENABLE_COVERAGE=ON
      - name: Build Tests
        run: cmake --build build --target test_runner
      - name: Run CTest
        run: cd build && ctest --output-on-failure
      - name: Coverage Report
        run: |
          lcov --directory build --capture --output-file coverage.info --ignore-errors unused
          lcov --remove coverage.info '/usr/*' '*/tests/*' --output-file coverage.info --ignore-errors unused
          lcov --list coverage.info

  build:
    name: Build Artifact
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tools
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build Binary
        run: cmake --build build --target main_app
      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: compiled-binary
          path: build/main_app

